name: Auto Podcast & Video Syndication (6 Media Channels)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Kênh chạy (all, spotify, castbox, dailymotion, youtube, bluesky, archive)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - spotify
          - castbox
          - dailymotion
          - youtube
          - bluesky
          - archive
      article_url:
        description: "URL bài viết trên dulichcheckin.com"
        required: true
        type: string
      h1_title:
        description: "Tiêu đề H1 (tùy chọn)"
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [run-media]

permissions:
  contents: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet requests Pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Generate Audio/Video & Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_KEYS: ${{ secrets.GEMINI_KEYS }}
          DM_API_KEY: ${{ secrets.DM_API_KEY }}
          DM_API_SECRET: ${{ secrets.DM_API_SECRET }}
          ARCHIVE_ACCESS_KEY: ${{ secrets.ARCHIVE_ACCESS_KEY }}
          ARCHIVE_SECRET_KEY: ${{ secrets.ARCHIVE_SECRET_KEY }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel || github.event.client_payload.channel || 'all' }}
          INPUT_ARTICLE_URL: ${{ github.event.inputs.article_url || github.event.client_payload.article_url }}
          INPUT_H1_TITLE: ${{ github.event.inputs.h1_title || github.event.client_payload.h1_title || '' }}
        run: python3 scripts/auto_media.py

      - name: Commit & Push updated RSS feeds & status
        if: always()
        run: |
          git config user.name "Du Lich Checkin Bot"
          git config user.email "bot@dulichcheckin.com"
          rm -rf _tmp_media
          git add spotify.xml castbox.xml status.json cover-spotify.jpg cover-castbox.jpg 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Auto update media & RSS feeds"
          git push
